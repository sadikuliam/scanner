<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHM Scanner - Total PDF < 100KB</title>
  <link rel="manifest" href="manifest.json" />
  
  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  
  <style>
    :root {
      --primary: #007bff;
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --accent: #28a745;
      --danger: #dc3545;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 0.8rem 1rem;
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      position: relative;
      z-index: 10;
    }

    .header-title { font-size: 1rem; font-weight: bold; }

    .pdf-size-badge {
      background: #333;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: bold;
    }
    .pdf-size-badge.warning { color: #ffc107; }
    .pdf-size-badge.danger { color: var(--danger); background: rgba(220, 53, 69, 0.2); }

    .step {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 1rem;
      overflow-y: auto;
    }

    .step.active { display: flex; }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, .btn-label {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button.secondary, .btn-label.secondary { background: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .capture-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
    }

    .editor-container {
      flex: 1;
      max-height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    img#editor-image { max-width: 100%; max-height: 100%; }

    /* CROPPER OVERRIDE */
    .cropper-view-box { outline: 2px solid var(--primary) !important; }
    .cropper-line { background-color: var(--primary) !important; }
    .cropper-point {
      background-color: var(--primary) !important;
      width: 20px !important;
      height: 20px !important;
      border-radius: 0 !important;
      border: 2px solid #fff !important;
    }

    .filter-options {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .filter-options button { padding: 0.5rem 0.8rem; font-size: 0.8rem; background: #2a2a2a; color: var(--text-dim); }
    .filter-options button.active-filter { background: var(--primary); color: #fff; border: 1px solid #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .page-card {
      position: relative;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
      aspect-ratio: 1 / 1.414;
    }

    .page-card img { width: 100%; height: 100%; object-fit: contain; background: #fff; }

    .page-card .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(220, 53, 69, 0.9);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 5;
      border: none;
      cursor: pointer;
    }

    .page-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.7);
      font-size: 0.7rem;
      padding: 2px 5px;
      border-radius: 4px;
    }

    #status-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 10000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <header>
    <span class="header-title">SHMscanner <100KB</span>
    <div id="pdf-size-display" class="pdf-size-badge">PDF: 0 KB</div>
  </header>

  <!-- STEP 1: CAPTURE -->
  <div id="step-1" class="step active">
    <div class="capture-container">
      <div style="font-size: 3rem;">📄➡️📉</div>
      <h3>Scan Documents to < 100KB PDF</h3>
      <p style="color: var(--text-dim); max-width: 300px; font-size: 0.9rem;">
        Add multiple pages. The app automatically compresses them to keep the total PDF size under 100KB while keeping text readable.
      </p>
      
      <div class="btn-group">
        <label class="btn-label">
          📸 Open Camera
          <input type="file" id="system-camera-input" accept="image/*" capture="environment" style="display:none;" />
        </label>
        
        <label class="btn-label secondary">
          🖼️ Gallery
          <input type="file" id="file-input" accept="image/*" style="display:none;" />
        </label>
      </div>
    </div>
  </div>

  <!-- STEP 2: CROP & FILTER -->
  <div id="step-2" class="step">
    <div class="editor-container">
      <img id="editor-image" src="" alt="To Crop" />
    </div>
    
    <div class="filter-options">
      <button id="f-bw" class="active-filter" onclick="setFilter('bw')">B&W Document (Best <100KB)</button>
      <button id="f-enhance" onclick="setFilter('enhance')">MagicColor</button>
      <button id="f-original" onclick="setFilter('original')">Original</button>
    </div>

    <div class="btn-group">
      <button class="secondary" onclick="cancelCrop()">Cancel</button>
      <button id="save-page-btn">Save & Add Next</button>
      <button id="finish-crop-btn">Save & Preview PDF</button>
    </div>
  </div>

  <!-- STEP 3: PREVIEW & EXPORT -->
  <div id="step-3" class="step">
    <div id="pages-grid" class="grid"></div>
    
    <div class="btn-group">
      <button class="secondary" onclick="goToStep(1)">+ Add Page</button>
      <button id="download-pdf-btn" onclick="exportPDF()">📄 Download <100KB PDF</button>
      <button class="secondary" onclick="exportJPG()">🖼️ Download JPGs</button>
    </div>
    <p style="color: var(--text-dim); font-size: 0.75rem; text-align: center; margin-top: 1rem;">
      Note: JPGs are saved individually at higher quality. PDF is heavily compressed.
    </p>
  </div>

  <div id="status-toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const A4_ASPECT_RATIO = 210 / 297;
    const TOTAL_PDF_TARGET_BYTES = 95 * 1024; // Strict total target: 95KB

    let scannedPagesRawCanvas = []; // Stores filtered, uncompressed canvases
    let cropper = null;
    let currentFilter = 'bw'; // Default to B&W for best compression
    let deferredPrompt = null;
    let originalImageObjectURL = null;

    const editorImg = document.getElementById('editor-image');
    const pagesGrid = document.getElementById('pages-grid');
    const pdfSizeDisplay = document.getElementById('pdf-size-display');

    function showToast(msg) {
      const toast = document.getElementById('status-toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    function goToStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');
      if (step === 3) renderPages();
    }

    // --- IMAGE INPUT ---
    document.getElementById('system-camera-input').addEventListener('change', handleFileSelect);
    document.getElementById('file-input').addEventListener('change', handleFileSelect);

    function handleFileSelect(e) {
      const files = e.target.files;
      if (!files || !files.length) return;
      
      showToast('Loading image...');
      const file = files[0];

      if (originalImageObjectURL) URL.revokeObjectURL(originalImageObjectURL);
      originalImageObjectURL = URL.createObjectURL(file);
      
      goToStep(2);
      if (cropper) cropper.destroy();

      editorImg.src = originalImageObjectURL;
      editorImg.onload = () => {
        cropper = new Cropper(editorImg, {
          aspectRatio: A4_ASPECT_RATIO,
          viewMode: 1,
          autoCropArea: 1,
          responsive: true,
          background: false,
          ready() { showToast('Adjust crop corners'); }
        });
      };
      e.target.value = '';
    }

    function cancelCrop() {
      if (originalImageObjectURL) URL.revokeObjectURL(originalImageObjectURL);
      goToStep(1);
    }

    // --- FILTERS ---
    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-options button').forEach(b => b.classList.remove('active-filter'));
      document.getElementById(`f-${filterType}`)?.classList.add('active-filter');
    }

    function applyFiltersToCanvas(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      if (currentFilter === 'original') return canvas;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        let gray = 0.299 * r + 0.587 * g + 0.114 * b;

        if (currentFilter === 'bw') {
          // Hard threshold for pure B&W - extreme compression
          let val = gray > 150 ? 255 : 0; 
          data[i] = data[i+1] = data[i+2] = val;
        } else if (currentFilter === 'enhance') {
          // Document contrast enhancement
          data[i]     = Math.min(255, (r - 128) * 1.5 + 135);
          data[i + 1] = Math.min(255, (g - 128) * 1.5 + 135);
          data[i + 2] = Math.min(255, (b - 128) * 1.5 + 135);
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    // --- SAVE PAGE (Internal Memory) ---
    function savePage(finish) {
      if (!cropper) return;
      
      showToast('Saving page...');

      // Get cropped canvas at reasonable resolution for processing
      const croppedCanvas = cropper.getCroppedCanvas({
        maxWidth: 1600, // Limit internal res to save memory
        imageSmoothingQuality: 'high'
      });

      // Apply selected filter
      applyFiltersToCanvas(croppedCanvas);

      // Store the unfiltered, high-res filtered canvas
      scannedPagesRawCanvas.push(croppedCanvas);

      if (originalImageObjectURL) {
        URL.revokeObjectURL(originalImageObjectURL);
        originalImageObjectURL = null;
      }
      cropper.destroy();
      cropper = null;

      if (finish) goToStep(3);
      else goToStep(1);
    }

    document.getElementById('save-page-btn').addEventListener('click', () => savePage(false));
    document.getElementById('finish-crop-btn').addEventListener('click', () => savePage(true));

    // --- PREVIEW & LIVE SIZE ---
    function renderPages() {
      pagesGrid.innerHTML = '';
      
      // Generate temporary optimized JPGs just for preview purpose
      scannedPagesRawCanvas.forEach((canvas, idx) => {
        const card = document.createElement('div');
        card.className = 'page-card';
        
        // Preview can be low res to save memory
        const previewUrl = canvas.toDataURL('image/jpeg', 0.3);
        
        card.innerHTML = `
          <img src="${previewUrl}" />
          <button class="delete-btn" onclick="deletePage(${idx})">×</button>
          <span class="page-badge">Page ${idx + 1}</span>
        `;
        pagesGrid.appendChild(card);
      });

      updateLivePdfSize();
    }

    function deletePage(idx) {
      scannedPagesRawCanvas.splice(idx, 1);
      renderPages();
    }

    // --- DYNAMIC PDF COMPRESSION LOGIC (<100KB TOTAL) ---
    function getByteSize(base64Str) {
      const base64WithoutHeader = base64Str.split(',')[1] || base64Str;
      return Math.round((base64WithoutHeader.length * 3) / 4);
    }

    // This is the core technology to achieve <100KB total PDF
    async function generateDynamicCompressedPdf() {
      const numPages = scannedPagesRawCanvas.length;
      if (numPages === 0) return null;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });

      // Calculate allowed size per page in JPG format within the PDF container
      // PDF structure adds overhead, so we target lower than 95KB
      const effectiveTarget = TOTAL_PDF_TARGET_BYTES - (numPages * 2000) - 5000; // Subtract overhead estimate
      const bytesPerPageTarget = Math.max(5000, Math.floor(effectiveTarget / numPages));

      console.log(`Total Target: 95KB. Pages: ${numPages}. Target per page JPG: ${Math.round(bytesPerPageTarget/1024)}KB`);

      for (let i = 0; i < numPages; i++) {
        const sourceCanvas = scannedPagesRawCanvas[i];
        
        // 1. Determine optimal resolution based on page count (More pages = smaller resolution)
        // This ensures text remains readable even at low file size
        let maxDim = 1000; // Base res for 1-2 pages
        if (numPages >= 3) maxDim = 800;
        if (numPages >= 5) maxDim = 650;
        if (numPages >= 8) maxDim = 500; // Significant downscaling for many pages

        let width = sourceCanvas.width;
        let height = sourceCanvas.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }

        const compCanvas = document.createElement('canvas');
        compCanvas.width = width;
        compCanvas.height = height;
        const ctx = compCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(sourceCanvas, 0, 0, width, height);

        // 2. Binary Search for optimal quality to hit exact byte target
        let minQuality = 0.01;
        let maxQuality = 0.80;
        let bestDataUrl = compCanvas.toDataURL('image/jpeg', minQuality); // Fallback
        
        // If pure B&W, we can use higher resolution and very low quality
        if (currentFilter === 'bw') {
            maxQuality = 0.30; // JPG artifacts don't show much on pure B&W
        }

        for (let iter = 0; iter < 5; iter++) {
          let midQuality = (minQuality + maxQuality) / 2;
          let testUrl = compCanvas.toDataURL('image/jpeg', midQuality);
          if (getByteSize(testUrl) <= bytesPerPageTarget) {
            bestDataUrl = testUrl;
            minQuality = midQuality;
          } else {
            maxQuality = midQuality;
          }
        }

        // 3. Add to PDF
        if (i > 0) pdf.addPage('a4', 'portrait');
        pdf.addImage(bestDataUrl, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      }

      return pdf.output('blob');
    }

    async function updateLivePdfSize() {
      const numPages = scannedPagesRawCanvas.length;
      if (numPages === 0) {
        pdfSizeDisplay.innerText = 'PDF: 0 KB';
        pdfSizeDisplay.className = 'pdf-size-badge';
        return;
      }

      // Estimate overhead (structure, etc.)
      const overheadEst = 5000 + (numPages * 1500);
      
      // Simulate PDF compression overhead - PDF compresses JPG streams internally too
      const estimatedSize = Math.round((TOTAL_PDF_TARGET_BYTES * 0.95) / 1024);
      
      // Since generating real PDF is slow, we show the target info
      pdfSizeDisplay.innerText = `Target PDF: < 95 KB (${numPages} Pages)`;
      pdfSizeDisplay.className = 'pdf-size-badge';

      if (numPages > 6 && currentFilter !== 'bw') {
          pdfSizeDisplay.innerText += ' - Suggest B&W';
          pdfSizeDisplay.className = 'pdf-size-badge warning';
      }
      if (numPages > 12) {
          pdfSizeDisplay.innerText = `Target PDF: ~100 KB (Quality Low)`;
          pdfSizeDisplay.className = 'pdf-size-badge danger';
      }
    }

    // --- EXPORT ---
    async function exportPDF() {
      if (scannedPagesRawCanvas.length === 0) return alert('No pages to export!');
      
      const downloadBtn = document.getElementById('download-pdf-btn');
      downloadBtn.disabled = true;
      downloadBtn.innerText = 'Compressing... Please wait';
      showToast('Optimizing PDF to <100KB...');

      try {
        const pdfBlob = await generateDynamicCompressedPdf();
        const finalSizeKb = (pdfBlob.size / 1024).toFixed(1);
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(pdfBlob);
        link.download = `Scan_${new Date().toISOString().slice(0,10)}_${finalSizeKb}KB.pdf`;
        link.click();
        
        showToast(`✅ PDF Downloaded (${finalSizeKb} KB)`);
        pdfSizeDisplay.innerText = `Last PDF: ${finalSizeKb} KB`;
        if (pdfBlob.size > 100*1024) pdfSizeDisplay.className = 'pdf-size-badge danger';
        else pdfSizeDisplay.className = 'pdf-size-badge';

      } catch (e) {
        console.error(e);
        alert('Error generating PDF.');
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.innerText = '📄 Download <100KB PDF';
      }
    }

    function exportJPG() {
      if (scannedPagesRawCanvas.length === 0) return alert('No pages to export!');
      showToast('Downloading JPGs...');
      
      // JPGs are exported at higher quality (individual files don't need to fit in 100KB total)
      scannedPagesRawCanvas.forEach((canvas, index) => {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `SHM_Page_${index + 1}.jpg`;
        a.click();
      });
    }
  </script>
</body>
</html>
