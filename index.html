<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHM Scanner - Strictly < 100KB PDF</title>
  <link rel="manifest" href="manifest.json" />
  
  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  
  <style>
    :root {
      --primary: #007bff;
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --accent: #28a745;
      --danger: #dc3545;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 0.8rem 1rem;
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .header-title { font-size: 1rem; font-weight: bold; }

    .pdf-size-badge {
      background: #28a745;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #fff;
      font-weight: bold;
    }

    .step {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 1rem;
      overflow-y: auto;
    }

    .step.active { display: flex; }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, .btn-label {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button.secondary, .btn-label.secondary { background: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .capture-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
    }

    .editor-container {
      flex: 1;
      max-height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    img#editor-image { max-width: 100%; max-height: 100%; }

    .cropper-view-box { outline: 2px solid var(--primary) !important; }
    .cropper-line { background-color: var(--primary) !important; }
    .cropper-point {
      background-color: var(--primary) !important;
      width: 20px !important;
      height: 20px !important;
      border-radius: 0 !important;
      border: 2px solid #fff !important;
    }

    .filter-options {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .filter-options button { padding: 0.5rem 0.8rem; font-size: 0.8rem; background: #2a2a2a; color: var(--text-dim); }
    .filter-options button.active-filter { background: var(--primary); color: #fff; border: 1px solid #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .page-card {
      position: relative;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
      aspect-ratio: 1 / 1.414;
    }

    .page-card img { width: 100%; height: 100%; object-fit: contain; background: #fff; }

    .page-card .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(220, 53, 69, 0.9);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 5;
      border: none;
      cursor: pointer;
    }

    .page-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.7);
      font-size: 0.7rem;
      padding: 2px 5px;
      border-radius: 4px;
    }

    #status-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 10000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <header>
    <span class="header-title">SHMscanner</span>
    <div id="pdf-size-display" class="pdf-size-badge">Strict Target: < 98 KB</div>
  </header>

  <!-- STEP 1: CAPTURE -->
  <div id="step-1" class="step active">
    <div class="capture-container">
      <div style="font-size: 3rem;">📄➡️📉</div>
      <h3>Strict 100KB PDF Generator</h3>
      <p style="color: var(--text-dim); max-width: 300px; font-size: 0.9rem;">
        This engine guarantees that the final PDF file will NEVER exceed 100KB, regardless of page count.
      </p>
      
      <div class="btn-group">
        <label class="btn-label">
          📸 Open Camera
          <input type="file" id="system-camera-input" accept="image/*" capture="environment" style="display:none;" />
        </label>
        
        <label class="btn-label secondary">
          🖼️ Gallery
          <input type="file" id="file-input" accept="image/*" style="display:none;" />
        </label>
      </div>
    </div>
  </div>

  <!-- STEP 2: CROP & FILTER -->
  <div id="step-2" class="step">
    <div class="editor-container">
      <img id="editor-image" src="" alt="To Crop" />
    </div>
    
    <div class="filter-options">
      <button id="f-bw" class="active-filter" onclick="setFilter('bw')">Pure B&W (Best Quality/Size)</button>
      <button id="f-enhance" onclick="setFilter('enhance')">Magic Scan</button>
      <button id="f-original" onclick="setFilter('original')">Original</button>
    </div>

    <div class="btn-group">
      <button class="secondary" onclick="cancelCrop()">Cancel</button>
      <button id="save-page-btn">Save & Add Next Page</button>
      <button id="finish-crop-btn">Save & Preview PDF</button>
    </div>
  </div>

  <!-- STEP 3: PREVIEW & EXPORT -->
  <div id="step-3" class="step">
    <div id="pages-grid" class="grid"></div>
    
    <div class="btn-group">
      <button class="secondary" onclick="goToStep(1)">+ Add Page</button>
      <button id="download-pdf-btn" onclick="exportPDF()">📄 Download PDF (<100KB Guaranteed)</button>
    </div>
  </div>

  <div id="status-toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const A4_ASPECT_RATIO = 210 / 297;
    const STRICT_PDF_LIMIT_BYTES = 98 * 1024; // Strict upper limit: 98KB

    let scannedPagesRawCanvas = [];
    let cropper = null;
    let currentFilter = 'bw';
    let originalImageObjectURL = null;

    const editorImg = document.getElementById('editor-image');
    const pagesGrid = document.getElementById('pages-grid');

    function showToast(msg) {
      const toast = document.getElementById('status-toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    function goToStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');
      if (step === 3) renderPages();
    }

    document.getElementById('system-camera-input').addEventListener('change', handleFileSelect);
    document.getElementById('file-input').addEventListener('change', handleFileSelect);

    function handleFileSelect(e) {
      const files = e.target.files;
      if (!files || !files.length) return;
      
      const file = files[0];
      if (originalImageObjectURL) URL.revokeObjectURL(originalImageObjectURL);
      originalImageObjectURL = URL.createObjectURL(file);
      
      goToStep(2);
      if (cropper) cropper.destroy();

      editorImg.src = originalImageObjectURL;
      editorImg.onload = () => {
        cropper = new Cropper(editorImg, {
          aspectRatio: A4_ASPECT_RATIO,
          viewMode: 1,
          autoCropArea: 1,
          responsive: true,
          background: false
        });
      };
      e.target.value = '';
    }

    function cancelCrop() {
      if (originalImageObjectURL) URL.revokeObjectURL(originalImageObjectURL);
      goToStep(1);
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-options button').forEach(b => b.classList.remove('active-filter'));
      document.getElementById(`f-${filterType}`)?.classList.add('active-filter');
    }

    function applyFiltersToCanvas(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      if (currentFilter === 'original') return canvas;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        let gray = 0.299 * r + 0.587 * g + 0.114 * b;

        if (currentFilter === 'bw') {
          let val = gray > 140 ? 255 : 0; // Crisp high-contrast B&W
          data[i] = data[i+1] = data[i+2] = val;
        } else if (currentFilter === 'enhance') {
          data[i]     = Math.min(255, (r - 128) * 1.4 + 135);
          data[i + 1] = Math.min(255, (g - 128) * 1.4 + 135);
          data[i + 2] = Math.min(255, (b - 128) * 1.4 + 135);
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    function savePage(finish) {
      if (!cropper) return;

      const croppedCanvas = cropper.getCroppedCanvas({
        maxWidth: 1200,
        imageSmoothingQuality: 'high'
      });

      applyFiltersToCanvas(croppedCanvas);
      scannedPagesRawCanvas.push(croppedCanvas);

      if (originalImageObjectURL) {
        URL.revokeObjectURL(originalImageObjectURL);
        originalImageObjectURL = null;
      }
      cropper.destroy();
      cropper = null;

      if (finish) goToStep(3);
      else goToStep(1);
    }

    document.getElementById('save-page-btn').addEventListener('click', () => savePage(false));
    document.getElementById('finish-crop-btn').addEventListener('click', () => savePage(true));

    function renderPages() {
      pagesGrid.innerHTML = '';
      scannedPagesRawCanvas.forEach((canvas, idx) => {
        const card = document.createElement('div');
        card.className = 'page-card';
        const previewUrl = canvas.toDataURL('image/jpeg', 0.2);
        
        card.innerHTML = `
          <img src="${previewUrl}" />
          <button class="delete-btn" onclick="deletePage(${idx})">×</button>
          <span class="page-badge">Page ${idx + 1}</span>
        `;
        pagesGrid.appendChild(card);
      });
    }

    function deletePage(idx) {
      scannedPagesRawCanvas.splice(idx, 1);
      renderPages();
    }

    // --- RECURSIVE AUTO-SCALING PDF COMPRESSOR (STRICT < 100KB GUARANTEE) ---
    async function buildStrictUnder100KBPdf() {
      const numPages = scannedPagesRawCanvas.length;
      if (numPages === 0) return null;

      const { jsPDF } = window.jspdf;

      // Start parameters
      let scaleFactor = 1.0;
      let quality = currentFilter === 'bw' ? 0.25 : 0.40;
      
      // Dynamic adjustments for page count
      if (numPages >= 3) { scaleFactor = 0.7; quality = 0.20; }
      if (numPages >= 5) { scaleFactor = 0.5; quality = 0.15; }

      let pdfBlob = null;
      let iterations = 0;

      // Recursive Loop: Re-generate PDF until total size is STRICTLY < 98KB
      while (iterations < 8) {
        iterations++;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });

        for (let i = 0; i < numPages; i++) {
          const srcCanvas = scannedPagesRawCanvas[i];
          
          const targetW = Math.max(300, Math.round(srcCanvas.width * scaleFactor));
          const targetH = Math.max(400, Math.round(srcCanvas.height * scaleFactor));

          const procCanvas = document.createElement('canvas');
          procCanvas.width = targetW;
          procCanvas.height = targetH;
          const ctx = procCanvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, targetW, targetH);
          ctx.drawImage(srcCanvas, 0, 0, targetW, targetH);

          const pageJpgData = procCanvas.toDataURL('image/jpeg', quality);

          if (i > 0) pdf.addPage('a4', 'portrait');
          pdf.addImage(pageJpgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
        }

        pdfBlob = pdf.output('blob');

        console.log(`Iteration ${iterations}: Size = ${(pdfBlob.size / 1024).toFixed(1)} KB (Scale: ${scaleFactor.toFixed(2)}, Quality: ${quality.toFixed(2)})`);

        // Check condition
        if (pdfBlob.size <= STRICT_PDF_LIMIT_BYTES) {
          break; // Successfully under limit!
        }

        // If exceeded, reduce parameters and retry
        scaleFactor *= 0.82; // Shrink dimensions
        quality *= 0.80;     // Drop JPG quality
      }

      return pdfBlob;
    }

    async function exportPDF() {
      if (scannedPagesRawCanvas.length === 0) return alert('No pages to export!');

      const downloadBtn = document.getElementById('download-pdf-btn');
      downloadBtn.disabled = true;
      downloadBtn.innerText = 'Compressing to <100KB...';

      try {
        const pdfBlob = await buildStrictUnder100KBPdf();
        const finalSizeKb = (pdfBlob.size / 1024).toFixed(1);

        const link = document.createElement('a');
        link.href = URL.createObjectURL(pdfBlob);
        link.download = `Scan_Doc_${finalSizeKb}KB.pdf`;
        link.click();

        showToast(`✅ Downloaded! Exact Size: ${finalSizeKb} KB`);
        document.getElementById('pdf-size-display').innerText = `Last PDF: ${finalSizeKb} KB`;

      } catch (e) {
        console.error(e);
        alert('Compression Error');
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.innerText = '📄 Download PDF (<100KB Guaranteed)';
      }
    }
  </script>
</body>
</html>
