<!-- Install Modal (Popup) -->
<div id="install-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;">
    <div style="background:white; padding:30px; border-radius:20px; max-width:300px; box-shadow:0 10px 25px rgba(0,0,0,0.3);">
        <h2 style="margin-bottom:15px;">Install SHM Scanner</h2>
        <p style="margin-bottom:20px; color:#555;">আপনার অ্যাপটি ইন্সটল করুন দ্রুত এবং অফলাইনে ব্যবহার করার জন্য।</p>
        <button id="modal-install-btn" class="btn" style="width:100%;">Install Now</button>
        <button onclick="document.getElementById('install-modal').style.display='none'" style="background:transparent; border:none; margin-top:15px; color:#999; cursor:pointer;">Later</button>
    </div>
</div>

<script>
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    const installModal = document.getElementById('install-modal');
    const modalInstallBtn = document.getElementById('modal-install-btn');

    // ব্রাউজার যদি অ্যাপটি ইন্সটল করতে দেয়, তবেই মোডাল দেখাবে
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // সাইট লোড হওয়ার পর ২ সেকেন্ড অপেক্ষা করে মোডাল দেখানো
        setTimeout(() => {
            installModal.style.display = 'flex';
        }, 2000);
    });

    // মোডালের Install বাটনে ক্লিক করলে
    modalInstallBtn.addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                installModal.style.display = 'none';
                deferredPrompt = null;
            });
        }
    });

    // সার্ভিস ওয়ার্কার রেজিস্টার করা
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        });
    }
</script>
