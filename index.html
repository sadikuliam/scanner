<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHM Scanner</title>
  <link rel="manifest" href="manifest.json" />
  
  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  
  <style>
    :root {
      --primary: #007bff;
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --accent: #28a745;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 1rem;
      background: var(--surface);
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .step {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 1rem;
      overflow-y: auto;
    }

    .step.active {
      display: flex;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }

    button, .btn-label {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s, background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:active, .btn-label:active {
      opacity: 0.8;
    }

    button.secondary, .btn-label.secondary {
      background: #333;
    }

    button.share-btn {
      background: #17a2b8;
    }

    /* Size Mode Selector Options Bar */
    .size-mode-container {
      background: var(--surface);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 0.8rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .size-mode-title {
      font-size: 0.9rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    .mode-toggle-group {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 400px;
    }

    .mode-btn {
      flex: 1;
      background: #2a2a2a;
      color: var(--text-dim);
      border: 2px solid transparent;
      padding: 0.6rem 0.5rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .mode-btn.active-mode {
      background: var(--primary);
      color: #fff;
      border-color: #fff;
    }

    /* Capture Step */
    .capture-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
    }

    /* Editor Container */
    .editor-container {
      flex: 1;
      max-height: 55vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    img#editor-image {
      max-width: 100%;
      max-height: 100%;
    }

    /* --- CROPPER CUSTOMIZATION: LARGE BLUE SQUARE TOUCH HANDLES --- */
    .cropper-view-box {
      outline: 3px solid var(--primary) !important;
      outline-color: var(--primary) !important;
    }

    .cropper-line {
      background-color: var(--primary) !important;
    }

    /* Large Square Corner & Side Handles */
    .cropper-point {
      background-color: var(--primary) !important;
      width: 22px !important;
      height: 22px !important;
      opacity: 1 !important;
      border-radius: 0 !important; /* Square shape */
      border: 2px solid #ffffff !important; /* White border for high visibility */
      box-sizing: border-box !important;
    }

    /* Offset handle positions for centered touch alignment */
    .cropper-point.point-e { right: -11px !important; margin-top: -11px !important; }
    .cropper-point.point-w { left: -11px !important; margin-top: -11px !important; }
    .cropper-point.point-n { top: -11px !important; margin-left: -11px !important; }
    .cropper-point.point-s { bottom: -11px !important; margin-left: -11px !important; }

    .cropper-point.point-ne { right: -11px !important; top: -11px !important; }
    .cropper-point.point-nw { left: -11px !important; top: -11px !important; }
    .cropper-point.point-sw { left: -11px !important; bottom: -11px !important; }
    .cropper-point.point-se { right: -11px !important; bottom: -11px !important; }

    .cropper-bg {
      background-image: none !important;
      background-color: #000 !important;
    }

    /* Grid Preview */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .page-card {
      position: relative;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1 / 1.414;
      border: 1px solid #333;
    }

    .page-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .page-card .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.7);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .filter-options {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0;
    }

    .filter-options button.active-filter {
      background: var(--primary);
      border: 1px solid #fff;
    }
  </style>
</head>
<body>

  <header id="header-title">SHMscanner</header>

  <!-- STEP 1: CAPTURE -->
  <div id="step-1" class="step active">
    <div class="capture-container">
      <h3>Take High Quality Document Photos</h3>
      <p style="color: var(--text-dim); max-width: 300px;">
        Use your camera to scan documents or choose an existing photo from your gallery.
      </p>
      
      <div class="btn-group">
        <label class="btn-label">
          📸 Open Camera
          <input type="file" id="system-camera-input" accept="image/*" capture="environment" style="display:none;" />
        </label>
        
        <label class="btn-label secondary">
          🖼️ Import from Gallery
          <input type="file" id="file-input" accept="image/*" style="display:none;" />
        </label>
      </div>
    </div>
  </div>

  <!-- STEP 2: CROPPER & FILTER -->
  <div id="step-2" class="step">
    <div class="editor-container">
      <img id="editor-image" src="" alt="To Crop" />
    </div>
    
    <div class="filter-options">
      <button class="secondary active-filter" id="f-original" onclick="setFilter('original')">Original</button>
      <button class="secondary" id="f-enhance" onclick="setFilter('enhance')">Magic Scan</button>
      <button class="secondary" id="f-bw" onclick="setFilter('bw')">B&W</button>
      <button class="secondary" onclick="rotateImage()">🔄 Rotate</button>
    </div>

    <div class="btn-group">
      <button class="secondary" onclick="goToStep(1)">Cancel</button>
      <button id="save-page-btn">Save & Add Next Page</button>
      <button id="finish-crop-btn">Save & Preview Document</button>
    </div>
  </div>

  <!-- STEP 3: PREVIEW & SIZE OPTIONS -->
  <div id="step-3" class="step">
    
    <!-- EXPORT SIZE OPTION SELECTOR -->
    <div class="size-mode-container">
      <span class="size-mode-title">Select Output File Size Target:</span>
      <div class="mode-toggle-group">
        <button id="mode-100kb" class="mode-btn active-mode" onclick="setSizeMode('compressed')">
          ⚡ Under 100 KB Mode
        </button>
        <button id="mode-original" class="mode-btn" onclick="setSizeMode('original')">
          💎 Original Size & Quality
        </button>
      </div>
    </div>

    <div id="pages-grid" class="grid"></div>
    
    <div class="btn-group">
      <button class="secondary" onclick="goToStep(1)">+ Add Page</button>
      <button onclick="exportPDF()">📄 Download A4 PDF</button>
      <button onclick="exportJPG()">🖼️ Download JPG</button>
      <button class="share-btn" onclick="sharePDF()">📤 Share PDF</button>
      <button class="share-btn" onclick="shareJPG()">📤 Share JPG</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const A4_ASPECT_RATIO = 210 / 297;
    const TARGET_MAX_BYTES = 100 * 1024; // 100 KB Limit

    let scannedPagesOriginal = [];
    let scannedPagesCompressed = [];
    let cropper = null;
    let currentFilter = 'original';
    let selectedSizeMode = 'compressed'; // 'compressed' or 'original'

    const editorImg = document.getElementById('editor-image');
    const pagesGrid = document.getElementById('pages-grid');

    function goToStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');

      const titles = {
        1: "CamScanner A4 - Step 1: High Quality Capture",
        2: "CamScanner A4 - Step 2: Crop & Enhance",
        3: "CamScanner A4 - Step 3: Export Options"
      };
      document.getElementById('header-title').innerText = titles[step];
      if (step === 3) renderPages();
    }

    // Toggle export size mode between 100KB mode and Original
    function setSizeMode(mode) {
      selectedSizeMode = mode;
      document.getElementById('mode-100kb').classList.toggle('active-mode', mode === 'compressed');
      document.getElementById('mode-original').classList.toggle('active-mode', mode === 'original');
      renderPages();
    }

    document.getElementById('system-camera-input').addEventListener('change', handleFileSelect);
    document.getElementById('file-input').addEventListener('change', handleFileSelect);

    function handleFileSelect(e) {
      const files = e.target.files;
      if (!files || !files.length) return;
      
      const reader = new FileReader();
      reader.onload = (evt) => {
        loadImageToEditor(evt.target.result);
        e.target.value = '';
      };
      reader.readAsDataURL(files[0]);
    }

    function loadImageToEditor(imageSrc) {
      goToStep(2);
      editorImg.src = imageSrc;
      setFilter('original');
      
      if (cropper) cropper.destroy();
      
      // Large blue square box locked to default A4 ratio
      cropper = new Cropper(editorImg, {
        aspectRatio: A4_ASPECT_RATIO,
        viewMode: 1,
        autoCropArea: 0.98,
        responsive: true,
        background: false,
        guides: true,
        center: true,
        cropBoxMovable: true,
        cropBoxResizable: true
      });
    }

    function rotateImage() {
      if (cropper) cropper.rotate(90);
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-options button').forEach(b => b.classList.remove('active-filter'));
      document.getElementById(`f-${filterType}`)?.classList.add('active-filter');
    }

    // Process canvas filters
    function applyFilterToCanvas(canvas) {
      if (currentFilter === 'original') return canvas;

      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];

        if (currentFilter === 'bw') {
          let gray = 0.299 * r + 0.587 * g + 0.114 * b;
          let val = gray > 125 ? 255 : (gray * 0.75);
          data[i] = data[i+1] = data[i+2] = val;
        } else if (currentFilter === 'enhance') {
          data[i]     = Math.min(255, (r - 128) * 1.25 + 135);
          data[i + 1] = Math.min(255, (g - 128) * 1.25 + 135);
          data[i + 2] = Math.min(255, (b - 128) * 1.25 + 135);
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    // Dynamic Compression Engine (<100KB Target)
    function compressToTargetSize(sourceCanvas, targetSizeBytes = TARGET_MAX_BYTES) {
      let quality = 0.75;
      let width = sourceCanvas.width;
      let height = sourceCanvas.height;

      let maxDim = 1200;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = width;
      tempCanvas.height = height;
      const ctx = tempCanvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0, width, height);
      applyFilterToCanvas(tempCanvas);

      let dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
      while (dataUrl.length * 0.75 > targetSizeBytes && quality > 0.15) {
        quality -= 0.08;
        dataUrl = tempCanvas.toDataURL('image/jpeg', quality);
      }

      return dataUrl;
    }

    // Original High-Quality Data Pipeline
    function getOriginalQualityDataUrl(sourceCanvas) {
      const fullCanvas = document.createElement('canvas');
      fullCanvas.width = sourceCanvas.width;
      fullCanvas.height = sourceCanvas.height;
      const ctx = fullCanvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0);
      applyFilterToCanvas(fullCanvas);
      
      return fullCanvas.toDataURL('image/jpeg', 0.95);
    }

    function saveCurrentPage() {
      if (!cropper) return;
      
      const croppedCanvas = cropper.getCroppedCanvas({
        imageSmoothingQuality: 'high'
      });

      // Generate both original and <100KB variants for instant switching
      const originalUrl = getOriginalQualityDataUrl(croppedCanvas);
      const compressedUrl = compressToTargetSize(croppedCanvas);

      scannedPagesOriginal.push(originalUrl);
      scannedPagesCompressed.push(compressedUrl);
    }

    document.getElementById('save-page-btn').addEventListener('click', () => {
      saveCurrentPage();
      goToStep(1);
    });

    document.getElementById('finish-crop-btn').addEventListener('click', () => {
      saveCurrentPage();
      goToStep(3);
    });

    function getActivePages() {
      return selectedSizeMode === 'compressed' ? scannedPagesCompressed : scannedPagesOriginal;
    }

    function renderPages() {
      pagesGrid.innerHTML = '';
      const currentPages = getActivePages();
      
      currentPages.forEach((src, idx) => {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.innerHTML = `
          <img src="${src}" />
          <span class="page-badge">${selectedSizeMode === 'compressed' ? '<100KB' : 'Original'}</span>
          <button class="delete-btn" onclick="deletePage(${idx})">×</button>
        `;
        pagesGrid.appendChild(card);
      });
    }

    function deletePage(idx) {
      scannedPagesOriginal.splice(idx, 1);
      scannedPagesCompressed.splice(idx, 1);
      renderPages();
    }

    function generatePDFBlob() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const pages = getActivePages();

      pages.forEach((pageData, index) => {
        if (index > 0) pdf.addPage('a4', 'portrait');
        pdf.addImage(pageData, 'JPEG', 0, 0, 210, 297, undefined, selectedSizeMode === 'compressed' ? 'FAST' : 'SLOW');
      });

      return pdf.output('blob');
    }

    function exportPDF() {
      const pages = getActivePages();
      if (!pages.length) return alert('No pages to export!');
      const pdfBlob = generatePDFBlob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(pdfBlob);
      link.download = `A4_Scan_${selectedSizeMode}_${new Date().toISOString().slice(0,10)}.pdf`;
      link.click();
    }

    function exportJPG() {
      const pages = getActivePages();
      if (!pages.length) return alert('No pages to export!');
      pages.forEach((src, index) => {
        const a = document.createElement('a');
        a.href = src;
        a.download = `A4_Scan_${selectedSizeMode}_Page_${index + 1}.jpg`;
        a.click();
      });
    }

    async function sharePDF() {
      const pages = getActivePages();
      if (!pages.length) return alert('No pages to share!');
      try {
        const pdfBlob = generatePDFBlob();
        const file = new File([pdfBlob], `A4_Scan_${selectedSizeMode}_${Date.now()}.pdf`, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'A4 PDF Document' });
        } else {
          alert('Sharing is not supported on this device/browser.');
        }
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      }
    }

    async function shareJPG() {
      const pages = getActivePages();
      if (!pages.length) return alert('No pages to share!');
      try {
        const files = await Promise.all(
          pages.map(async (dataUrl, idx) => {
            const blob = await (await fetch(dataUrl)).blob();
            return new File([blob], `A4_Scan_${selectedSizeMode}_Pg${idx + 1}.jpg`, { type: 'image/jpeg' });
          })
        );
        if (navigator.canShare && navigator.canShare({ files })) {
          await navigator.share({ files, title: 'A4 Scanned JPG' });
        } else {
          alert('Sharing is not supported on this device/browser.');
        }
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      }
    }
  </script>
</body>
</html>
